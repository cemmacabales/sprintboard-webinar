name: PR gate

# The deterministic half of the pipeline.
#
# Runs the checks on every pull request, and applies `ready-to-merge` only when
# the checks pass AND the Codex review automation has labelled the pull request
# `codex-approved`. New commits clear the review labels, because a review only
# covers the code it read. A human performs the merge.
#
# This workflow calls no model and needs no API key. The judgment calls are
# made by automations in the Codex app, on a ChatGPT plan.
#
# It must exist on every branch pull requests target, including the demo branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    # Ignore label changes that don't affect the verdict.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'codex-approved' ||
      github.event.label.name == 'changes-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build

  gate:
    needs: checks
    # Fork pull requests get a read-only token, so only gate same-repo branches.
    if: >-
      always() &&
      needs.checks.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Apply or clear ready-to-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          CHECKS: ${{ needs.checks.result }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'codex-approved') }}
          BLOCKED: ${{ contains(github.event.pull_request.labels.*.name, 'changes-requested') }}
        run: |
          remove() { gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$1" >/dev/null 2>&1 || true; }

          if [ "$ACTION" = "synchronize" ]; then
            remove codex-approved
            remove changes-requested
            remove ready-to-merge
            echo "New commits cleared the review labels; the review automation will look again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CHECKS" = "success" ] && [ "$APPROVED" = "true" ] && [ "$BLOCKED" != "true" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label ready-to-merge
            echo "Checks passed and Codex approved: labelled ready-to-merge." >> "$GITHUB_STEP_SUMMARY"
          else
            remove ready-to-merge
            echo "Not ready: checks=$CHECKS codex-approved=$APPROVED changes-requested=$BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          fi
