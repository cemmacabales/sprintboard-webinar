name: Agent queue

# Instant acknowledgement when someone labels an issue `agent-ready`.
#
# The implementation itself is done by the "Agent: implement" automation in the
# Codex app, which runs on a ChatGPT plan and picks the issue up on its next
# run. No API key is involved anywhere in this repository.
#
# Workflows triggered by issue events only run from the default branch.
# Applying a label needs write access, so only collaborators can queue work.

on:
  issues:
    types: [labeled]

jobs:
  acknowledge:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Confirm the issue is queued
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > body.md <<'MD'
          **Queued for Codex.**

          The **Agent: implement** automation picks up `agent-ready` issues on its next run.

          | Stage | What you will see |
          | --- | --- |
          | Claimed | this label changes to `agent-working` |
          | Implemented | a pull request labelled `agent-pr` links back here |
          | Reviewed | the pull request gets `codex-approved` or `changes-requested` |
          | Gated | checks pass + `codex-approved` → `ready-to-merge` |
          | Merged | by a human |
          MD
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file body.md
